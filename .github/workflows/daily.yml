name: Daily Short

on:
  schedule:
    - cron: "30 11 * * *"   # every day at 11:30 UTC (5:00 PM India time)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = make the video but do NOT upload, 0 = upload"
        default: "1"

permissions:
  contents: write

jobs:
  make-short:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install video tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python libraries
        run: pip install -r requirements.txt

      - name: Make the Short
        run: python make_short.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PRIVACY: private
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}

      - name: Keep the video and details for download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short
          path: output/
          if-no-files-found: ignore

      - name: Remember which idea was used
        if: success()
        run: |
          if [ -f history.json ]; then
            git config user.name "shorts-bot"
            git config user.email "shorts-bot@users.noreply.github.com"
            git add history.json
            git diff --cached --quiet || (git commit -m "Update idea history" && git push)
          fi
