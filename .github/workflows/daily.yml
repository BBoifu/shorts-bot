name: Daily Short (plan + build)

on:
  schedule:
    - cron: "30 3 * * *"   # every day at 03:30 UTC (9:00 AM India time)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install video tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation
      - run: pip install -r requirements.txt
      - name: Write today's story
        run: python make_short.py plan
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Save the plan and story history
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add plan history.json
          git diff --cached --quiet || (git commit -m "New plan" && git push)
      - name: Build the Short
        run: python make_short.py build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PRIVACY: private
          # Stays "1" (make the video, do NOT upload) until you add a repo variable DRY_RUN = 0
          DRY_RUN: ${{ vars.DRY_RUN || '1' }}
      - name: Keep the video for download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short
          path: output/
          if-no-files-found: ignore
